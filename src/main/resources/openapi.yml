openapi: 3.0.3
info:
  title: API de Gestión de Tareas - NUEVO SPA
  description: |
    API RESTful para gestionar tareas con autenticación JWT.
    
    **Metodología API First:** Esta API fue diseñada primero mediante OpenAPI,
    y el código Java fue generado automáticamente desde esta especificación.
  version: 1.0.0
  contact:
    name: Bastián León
    email: bastianleond@gmail.com

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo

tags:
  - name: Autenticación
    description: Endpoints de autenticación y autorización JWT
  - name: Tareas
    description: Operaciones CRUD sobre tareas

paths:
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Autenticar usuario y obtener token JWT
      description: Valida las credenciales del usuario y devuelve un token JWT para autenticación
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              usuario_normal:
                summary: Usuario normal
                value:
                  email: "tuemail@gmail.com"
                  password: "user123"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tareas:
    get:
      tags:
        - Tareas
      summary: Listar todas las tareas del usuario
      description: Obtiene todas las tareas asociadas al usuario autenticado
      operationId: listarTareas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tareas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TareaResponse'
        '403':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Tareas
      summary: Crear una nueva tarea
      description: Crea una nueva tarea asociada al usuario autenticado
      operationId: crearTarea
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaRequest'
            examples:
              tarea_simple:
                summary: Tarea simple
                value:
                  titulo: "Implementar API First"
                  descripcion: "Crear archivo openapi.yml y configurar plugin"
                  estadoId: 1
              tarea_con_fecha:
                summary: Tarea con fecha de vencimiento
                value:
                  titulo: "Revisar código"
                  estadoId: 1
                  fechaVencimiento: "2025-10-20"
      responses:
        '201':
          description: Tarea creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'

  /tareas/{id}:
    get:
      tags:
        - Tareas
      summary: Obtener una tarea por ID
      description: Obtiene los detalles de una tarea específica
      operationId: obtenerTarea
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID de la tarea a obtener
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      tags:
        - Tareas
      summary: Actualizar una tarea existente
      description: Actualiza todos los campos de una tarea específica
      operationId: actualizarTarea
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID de la tarea a actualizar
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaRequest'
      responses:
        '200':
          description: Tarea actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Tareas
      summary: Eliminar una tarea
      description: Elimina permanentemente una tarea del sistema
      operationId: eliminarTarea
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID de la tarea a eliminar
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Tarea eliminada exitosamente
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: | 
        Token JWT obtenido del endpoint /auth/login.
        Ejemplo: Bearer eyJhbGciOiJIUzUxMiJ9...

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 50
          description: Correo de usuario
          example: "tucorreo@gmail.com"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          description: Contraseña del usuario
          example: "user123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT para autenticación
          example: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJhZG1pbiIsImlhdCI6MTY5..."
        tipo:
          type: string
          description: Tipo de token
          example: "Bearer"
        usuario:
          $ref: "#/components/schemas/UsuarioResponse"


    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del usuario
          example: 1
        email:
          type: string
          description: Correo del usuario
          example: "bastianleond@gmail.com"
        nombre:
          type: string
          description: Nombre del usuario
          example: "Bastián"
        apellido:
          type: string
          description: Apellido del usuario
          example: "León"

    TareaRequest:
      type: object
      required:
        - titulo
        - estadoId
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 100
          description: Título de la tarea
          example: "Implementar API First"
        descripcion:
          type: string
          minLength: 5
          maxLength: 500
          description: Descripción detallada de la tarea (opcional)
          example: "Crear el archivo openapi.yml y configurar el plugin de generación de código"
        estadoId:
          type: integer
          format: int64
          description: ID del estado de la tarea (1=Pendiente, 2=En Progreso, 3=Completada)
          example: 1
        fechaVencimiento:
          type: string
          format: date
          description: Fecha de vencimiento de la tarea (opcional)
          example: "2025-10-20"

    TareaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID único de la tarea
          example: 1
        titulo:
          type: string
          description: Título de la tarea
          example: "Implementar API First"
        descripcion:
          type: string
          description: Descripción de la tarea
          example: "Crear el archivo openapi.yml y configurar el plugin de generación de código en pom.xml"
        estado:
          $ref: '#/components/schemas/EstadoResponse'
        usuarioId:
          type: integer
          format: int64
          description: ID del usuario propietario de la tarea
          example: 1
        fechaCreacion:
          type: string
          format: date-time
          description: Fecha y hora de creación de la tarea
          example: "2025-10-13T10:30:00Z"
        fechaVencimiento:
          type: string
          format: date
          description: Fecha de vencimiento de la tarea
          example: "2025-10-20"
        fechaActualizacion:
          type: string
          format: date-time
          description: Fecha de vencimiento de la tarea
          example: "2025-10-13T10:30:00Z"

    EstadoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID del estado
          example: 1
        nombre:
          type: string
          description: Nombre del estado
          example: "Pendiente"
        descripcion:
          type: string
          description: Descripción del estado
          example: "Tarea creada pero no iniciada"

    ApiErrorCodes:
      type: string
      description: Códigos identificatorios de errores
      enum:
        - SERVIDOR
        - TAREA_NO_ENCONTRADA
        - VALIDACIONES
        - PETICION
        - RECURSO_NO_ENCONTRADO
        - NO_AUTORIZADO
        - CREDENCIALES_INVALIDAS
      x-enum-descriptions:
        SERVIDOR: "Error no controlado"
        TAREA_NO_ENCONTRADA: "La tarea buscada no se encuentra en los registros"
        VALIDACIONES: "Petición request contiene errores de validación"
        PETICION: "Request mal formado"
        RECURSO_NO_ENCONTRADO: "La url que buscas no se encuentra en el sistema"
        NO_AUTORIZADO: "No estas autentificado por la app, ingresa en /auth/login"
        CREDENCIALES_INVALIDAS: "Las credenciales no coinciden con los registros"
      example: TAREA_NO_ENCONTRADA

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          description: Mensaje de error descriptivo
          example: "Error en la solicitud"
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error
          example: "2025-10-13T10:30:00Z"
        url:
          type: string
          description: La url consultada
          example: "/auth/login"
        codigoHttp:
          type: integer
          description: Código HTTP del error
          example: 400
        codigoApi:
          $ref: "#/components/schemas/ApiErrorCodes"

  responses:
    UnauthorizedError:
      description: Token JWT no válido, expirado o ausente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensaje: "No estas autorizado para realizar esta acción"
            timestamp: "2025-10-13T10:30:00Z"
            url: "/tareas"
            codigoHttp: 403
            codigoApi: NO_AUTORIZADO

    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensaje: "Recurso no encontrado"
            timestamp: "2025-10-13T10:30:00Z"
            url: "/tareas/1"
            codigoHttp: 404
            codigoApi: TAREA_NO_ENCONTRADA

    InvalidCredentialsError:
      description: Credenciales inválidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensaje: "Las credenciales no coinciden con nuestros registros"
            timestamp: "2025-10-13T10:30:00Z"
            url: "/auth/login"
            codigoHttp: 401
            codigoApi: CREDENCIALES_INVALIDAS

    BadRequestError:
      description: Solicitud inválida o datos incorrectos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensaje: "Solicitud inválida"
            timestamp: "2025-10-13T10:30:00Z"
            url: "/tareas"
            codigoHttp: 400
            codigoApi: VALIDACIONES